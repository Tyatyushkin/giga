[pytest]
markers =
    smoke: базовые проверки работоспособности
    regression: проверка, что старый функционал не сломался
    e2e: end-to-end тест (основной путь)
    blocker: тест, помеченный как skip из-за неопределённого поведения
    unit: юнит-тест для API-стаба
    visual: визуальный тест (Selenium, если будет добавлен)
    purchase: тесты покупки (J01-purchase-flow)
    purchase_main: основной путь покупки (TC-J01-00)
    purchase_variant: вариант основного пути (TC-J01-01..08)
    reorder: тесты повтора заказа (J02-reorder-from-history)
    reorder_main: основной путь повтора (TC-J02-00)
    reorder_variant: вариант повтора (TC-J02-01..06)
    reorder_skip: тест с пропуском BLOCKER (вопрос не описан в REQ)
    corp: тесты корпоративных заказов (J03-corporate-business)
    corp_main: основной путь корпоративного заказа (TC-J03-00)
    corp_variant: вариант корпоративного заказа (TC-J03-01..03)