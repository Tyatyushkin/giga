[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
markers =
    e2e: End-to-end тест (полный сквозной сценарий)
    smoke: Smoke-тест (критический путь)
    blocker: Нарушение правил — требует решения от человека
    gap: Тест, чей ожидаемый результат не определён в требованиях
    J02-free-limited: Маркер для фильтрации тестов джорни J02