[pytest]
testpaths = output/tests
python_files = test_*.py
python_classes = Test*
# Никаких флагов, пишущих по относительному пути: они резолвятся от текущего
# каталога, а не от rootdir, и засоряют корень репозитория. Каталог результатов
# Allure задаётся явно при запуске — см. --alluredir в отчётах journey.
addopts =
    --strict-markers
    --tb=short
    -v
    -p no:warnings

# Единый словарь маркеров на репозиторий. Включён --strict-markers:
# незарегистрированный маркер роняет прогон на сборке, поэтому под-агенты
# этот файл не правят.
#
# Строки stub / browser / blocker правит человек.
# Строки J<NN> ведёт scripts/sync_markers.py по output/suites/_index.json —
# правя их вручную, вы потеряете правку на следующем прогоне.
markers =
    stub: Тест через детерминированную эмуляцию API (pytest-stub-writer)
    browser: Тест через WebDriver в браузере (browser-test-writer)
    blocker: Шаг, чей ожидаемый результат не определён требованиями — помечен skip
    J01: Journey J01 — Жизненный цикл топологии Knox: деплой, работа с файлом через WebHDFS…
    J02: Journey J02 — Наполнение коллекции: лайк трека, создание плейлиста и его пополнение…
    J03: Journey J03 — Устойчивость сессии: обрыв сети при воспроизведении, выход из…

filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning

log_cli = false