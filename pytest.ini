[pytest]
testpaths = output/tests
python_files = test_*.py
python_classes = Test*
# Никаких флагов, пишущих по относительному пути: они резолвятся от текущего
# каталога, а не от rootdir, и засоряют корень репозитория. Каталог результатов
# Allure задаётся явно при запуске — см. --alluredir в отчётах journey.
addopts =
    --strict-markers
    --tb=short
    -v
    -p no:warnings

# Единый словарь маркеров на репозиторий. Включён --strict-markers:
# незарегистрированный маркер роняет прогон, поэтому список правит человек,
# а не под-агенты. J<NN> заводится при появлении journey, а не заранее.
markers =
    stub: Тест через детерминированную эмуляцию API (pytest-stub-writer)
    browser: Тест через WebDriver в браузере (browser-test-writer)
    blocker: Шаг, чей ожидаемый результат не определён требованиями — помечен skip
    J01: Journey J01 — онбординг и первое воспроизведение
    J02: Journey J02 — офлайн-скачивание и поведение сети

filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning

log_cli = false