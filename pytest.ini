[pytest]
testpaths = output/tests
python_files = test_*.py
python_classes = Test*
addopts =
    --alluredir=allure-results
    --strict-markers
    --tb=short
    -v
    -p no:warnings
    --ignore=conftest.py

markers =
    e2e: End-to-end тест (полный сквозной сценарий)
    smoke: Smoke-тест (критический путь)
    blocker: Нарушение правил — требует решения от человека
    gap: Тест, чей ожидаемый результат не определён в требованиях
    visual: Визуальный тест браузера (требуется Selenium)
    selenium: Тест через WebDriver
    screenshot_on_fail: Делать скриншот при падении теста
    api_stub: Тест через эмуляцию API (без браузера)
    J01: Маркер для джорни J01 (онбординг)
    J02: Маркер для джорни J02 (офлайн/сеть)
    J03: Маркер для джорни J03 (лимиты)
    J04: Маркер для джорни J04 (синхронизация)

filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning

log_cli = false
log_file = pytest.log